name: Claude (@claude)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v10
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 20
            --append-system-prompt "This is DamageLens. Follow .github/review-guidelines.md. Use uv for everything (uv sync, uv run pytest). Never commit data, tiles, weights or runs/. Commit messages are one line: type(scope): ... (#issue)."
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(uv sync:*),Bash(uv run pytest:*),Bash(uv run damagelens-label validate:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*)"
