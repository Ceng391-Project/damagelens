[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damagelens"
version = "0.1.0"
description = "Disaster damage assessment from pre/post satellite and aerial images"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.4",
  "segmentation-models-pytorch==0.5.0",
  "numpy",
  "scipy",
  "scikit-image",
  "scikit-learn",
  "pyarrow",
  "pillow",
  "matplotlib",
  "rasterio",
  "pyproj",
]

[dependency-groups]
dev = ["pytest"]
# only the frozen scripts under experiments/ need these
experiments = [
  "pandas",
  "h5py",
  "geopandas",
  "shapely",
  "pystac-client",
  "planetary-computer",
  "meteostat>=2.1",
  "requests",
  "huggingface-hub",
  "markdown",
  "torchvision",
]

[tool.uv]
default-groups = ["dev", "experiments"]

[project.scripts]
damagelens-train = "damagelens.train:main"
damagelens-eval = "damagelens.evaluate:main"
damagelens-summarize = "damagelens.summarize:main"
damagelens-label = "damagelens.label.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"damagelens.label" = ["static/*"]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E9", "F", "B", "UP"]
ignore = ["E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
