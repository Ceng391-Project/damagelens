[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damagelens"
version = "0.1.0"
description = "Disaster damage assessment from pre/post satellite and aerial images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "segmentation-models-pytorch==0.5.0",
  "numpy",
  "scipy",
  "scikit-image",
  "scikit-learn",
  "pyarrow",
  "pillow",
  "matplotlib",
  "rasterio",
  "pyproj",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
damagelens-train = "damagelens.train:main"
damagelens-eval = "damagelens.evaluate:main"
damagelens-summarize = "damagelens.summarize:main"
damagelens-label = "damagelens.label.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"damagelens.label" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
